name: ViScan CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # =============================================================
  # 1. Automated Test Suite Gate
  # =============================================================
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Test ai-avatar service
      - name: Set up Python for ai-avatar
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Run ai-avatar Test Suite
        working-directory: ./ai-avatar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest -v tests/
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          ENVIRONMENT: testing
          ANAM_API_KEY: "test-api-key"

  # =============================================================
  # 2. Production Deployment via SSH
  # =============================================================
  deploy:
    name: Deploy to Production Server
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST || '16.192.134.200' }}
          username: ${{ secrets.SERVER_USER || 'ubuntu' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            APP_DIR="/home/ubuntu/viscan"
            
            # Ensure repo directory exists
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://github.com/cjephuneh/viscan.git "$APP_DIR"
            fi
            
            cd "$APP_DIR"
            
            # Pull latest code
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            
            # Ensure environment configs are present
            test -f ai-interpreter/.env || cp ai-interpreter/.env.example ai-interpreter/.env
            test -f backend/.env || cp backend/.env.example backend/.env
            
            # Build and deploy production containers
            docker compose -f docker-compose.prod.yml up --build -d
            
            # Verify health
            sleep 5
            docker compose -f docker-compose.prod.yml ps
