name: ViScan CI

# Runs every service's test suite on every push and pull request.
#
# Deployment is NOT done from here: the production server (gp5) polls this
# repository and deploys origin/main by itself once the check named
# "all tests passed" is green (see scripts/server-deploy.sh).
#
# The Kaggle job is the training hand-off for the AI developers. It starts
# only after the gates below are green, and only when the repository admin
# has set:
#   secret  KAGGLE_API_TOKEN
#   variable KAGGLE_KERNEL_SLUG   (kaggle username/kernel-slug)
#   variable KAGGLE_DATASET       (kaggle username/dataset-slug)
# The Hugging Face upload token stays a Kaggle notebook secret (HF_TOKEN),
# together with HF_MODEL_REPO. It is not a GitHub secret.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: scan tracked files
        run: python kaggle/scan_secrets.py
      - name: gitleaks
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --no-git --exit-code 1

  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -v
        env:
          FLASK_CONFIG: testing

  ai-interpreter:
    name: ai-interpreter (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-interpreter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-interpreter/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: type check
        run: python -m mypy
      - name: unit and integration
        run: python -m pytest -v -m "not security and not memory and not ai and not pipeline"
        env:
          INTERPRETER_MODE: heuristic
      - name: code injection
        run: python -m pytest -v -m security
        env:
          INTERPRETER_MODE: heuristic
      - name: memory
        run: python -m pytest -v -m memory
        env:
          INTERPRETER_MODE: heuristic
      - name: ai response contract
        run: python -m pytest -v -m ai
        env:
          INTERPRETER_MODE: heuristic
      - name: pipeline package
        run: python -m pytest -v -m pipeline
        env:
          INTERPRETER_MODE: heuristic

  ai-avatar:
    name: ai-avatar (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-avatar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-avatar/requirements.txt
      - run: pip install -r requirements.txt
      # Live Anam API tests are opt-in (ANAM_LIVE_TESTS=1) and stay skipped here.
      - run: python -m pytest -v
        env:
          ENVIRONMENT: testing
          ANAM_API_KEY: test-api-key

  frontend:
    name: frontend (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test

  # Single job the server can look at ("ci passed for this commit?").
  # The Kaggle job is not in this list: a missing dataset must not block an app deploy.
  ci-passed:
    name: all tests passed
    needs: [secret-scan, backend, ai-interpreter, ai-avatar, frontend]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All test suites passed."

  train-on-kaggle:
    name: push training job to kaggle
    needs: [secret-scan, backend, ai-interpreter, ai-avatar, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: decide whether a training run can start
        id: gate
        env:
          TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          SLUG: ${{ vars.KAGGLE_KERNEL_SLUG }}
          DATASET: ${{ vars.KAGGLE_DATASET }}
        run: |
          set -euo pipefail
          {
            echo "### Kaggle training gate"
            echo "Secret scan, type check, integration, injection, memory, and the AI contract already passed."
            echo "Training images are not in git. This checkout has no Malhari manifest."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$TOKEN" ] || [ -z "$SLUG" ] || [ -z "$DATASET" ]; then
            echo "start=false" >> "$GITHUB_OUTPUT"
            {
              echo ""
              echo "Training was not started. The repository admin still needs:"
              echo "- Actions secret \`KAGGLE_API_TOKEN\`"
              echo "- Actions variable \`KAGGLE_KERNEL_SLUG\` (Kaggle username/kernel-slug)"
              echo "- Actions variable \`KAGGLE_DATASET\` (Kaggle username/dataset-slug)"
              echo ""
              echo "Until \`KAGGLE_DATASET\` points at a dataset that contains manifest.csv, a push would not train."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "start=true" >> "$GITHUB_OUTPUT"
          fi
      - name: package and push the kernel
        if: steps.gate.outputs.start == 'true'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_KERNEL_SLUG: ${{ vars.KAGGLE_KERNEL_SLUG }}
          KAGGLE_DATASET: ${{ vars.KAGGLE_DATASET }}
        run: |
          set -euo pipefail
          pip install kaggle
          python kaggle/prepare_kernel.py "$RUNNER_TEMP/viscan-kernel" "$KAGGLE_KERNEL_SLUG" "$KAGGLE_DATASET"
          kaggle kernels push -p "$RUNNER_TEMP/viscan-kernel"
