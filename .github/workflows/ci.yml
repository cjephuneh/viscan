name: ViScan CI

# Runs every service's test suite on every push and pull request.
#
# Deployment is NOT done from here: the production server (gp5) polls this
# repository and deploys origin/main by itself once this workflow is green
# for that commit (see scripts/server-deploy.sh). That way no SSH key or
# other secret has to be stored in GitHub.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -v
        env:
          FLASK_CONFIG: testing

  ai-interpreter:
    name: ai-interpreter (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-interpreter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-interpreter/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v
        env:
          INTERPRETER_MODE: heuristic

  ai-avatar:
    name: ai-avatar (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-avatar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-avatar/requirements.txt
      - run: pip install -r requirements.txt
      # Live Anam API tests are opt-in (ANAM_LIVE_TESTS=1) and stay skipped here.
      - run: python -m pytest -v
        env:
          ENVIRONMENT: testing
          ANAM_API_KEY: test-api-key

  frontend:
    name: frontend (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test

  # Single job the server can look at ("ci passed for this commit?").
  ci-passed:
    name: all tests passed
    needs: [backend, ai-interpreter, ai-avatar, frontend]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All test suites passed."
