# Routing rules shared by the HTTP (port 80) and HTTPS (port 443) server
# blocks in site.conf.tpl. Included inside each `server { }`.

set $svc_frontend    http://frontend:3000;
set $svc_interpreter http://ai-interpreter:5050;
set $svc_avatar      http://ai-avatar:9090;
set $svc_backend     http://backend:8080;

# Gateway health check
location = /health {
    default_type application/json;
    return 200 '{"status":"healthy","service":"viscan-gateway"}\n';
}

# -------------------------------------------------------------
# Routing rules (nginx precedence: exact "=" > regex "~" in file
# order > longest prefix). Three services share the /api/v1
# namespace, so the split is done by path and by trailing slash:
#   * Flask backend routes ALWAYS end with "/"  (e.g. /health/)
#   * ai-interpreter routes never do          (e.g. /health)
# -------------------------------------------------------------

# ---- 1. AI Avatar (video reports + player) ------------------
location /player/ {
    proxy_pass $svc_avatar;
}
location ~ ^/api/v1/(reports|personas)(/|$) {
    proxy_pass $svc_avatar;
    proxy_read_timeout 120s;
}

# ---- 2. Core backend (Flask-Smorest; trailing-slash routes) ---
# Health / docs. Both exact rules are needed: with only the "/health/"
# rule nginx would 301 "/health" to "/health/" (its trailing-slash rule).
location = /api/v1/health        { proxy_pass $svc_interpreter; }
location = /api/v1/health/       { proxy_pass $svc_backend; }
location = /api/v1/docs          { proxy_pass $svc_backend; }
location = /api/v1/openapi.json  { proxy_pass $svc_backend; }
# Resources owned by the backend. NOTE the mandatory trailing "/" after
# the resource name: "/api/v1/screenings/" is the backend collection,
# while "/api/v1/screenings" (no slash) is ai-interpreter's history list.
location ~ ^/api/v1/(facilities|screenings|analysis-queue|analysis-jobs|ai-results|maps|notifications|language|voice)/ {
    proxy_pass $svc_backend;
    proxy_read_timeout 90s;
}
# Backend image records: /api/v1/images/<id>/  (trailing slash).
# /api/v1/images/<id>/file (no slash) belongs to ai-interpreter,
# which is what the frontend uses; the backend serves its files
# under /api/v1/backend-images/<id>/file to avoid the collision.
location ~ ^/api/v1/images/[0-9]+/$ {
    proxy_pass $svc_backend;
}
location ~ ^/api/v1/backend-images/[0-9]+/file$ {
    proxy_pass $svc_backend;
}

# ---- 3. AI Interpreter (everything else under /api/v1) --------
# interpret, interpretations/*, images/*/file, intake/*, avatar/*,
# worklist, patients/*, places/*, partner-hospitals, metrics,
# dataset/export, health
location /api/v1/ {
    proxy_pass $svc_interpreter;
    proxy_read_timeout 180s;   # vision-model calls can take 30-90 s
    proxy_request_buffering off;
}

# ---- 4. Next.js frontend ------------------------------------
location / {
    proxy_pass $svc_frontend;
    # proxy_set_header is not inherited once redefined in a block,
    # so the common headers are repeated here.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebRTC / WebSocket upgrades for interactive avatars & HMR
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
}
