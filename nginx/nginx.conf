events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # Resolve service names through Docker's embedded DNS at request time,
    # so a restarted container (new IP) never leaves nginx stuck on a stale
    # address. Requires variables in proxy_pass (see $svc_* below).
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    log_format viscan '$remote_addr [$time_local] "$request" $status '
                      '$body_bytes_sent upstream=$upstream_addr rt=$request_time';
    access_log /var/log/nginx/access.log viscan;

    # Common proxy headers.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # Server blocks are generated from site.conf.tpl by 40-viscan-tls.sh
    # (domain + certificate paths) into conf.d/viscan.conf.
    include /etc/nginx/conf.d/*.conf;
}
