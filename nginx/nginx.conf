events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # Upstream services
    upstream frontend_service {
        server frontend:3000;
    }

    upstream ai_interpreter_service {
        server ai-interpreter:5050;
    }

    upstream ai_avatar_service {
        server ai-avatar:9090;
    }

    upstream backend_service {
        server backend:8080;
    }

    server {
        listen 80;
        server_name _;

        # Gateway health check
        location /health {
            return 200 '{"status":"healthy","service":"viscan-gateway"}\n';
            add_header Content-Type application/json;
        }

        # -------------------------------------------------------------
        # 1. AI Avatar Microservice (Video Player & Report API)
        # -------------------------------------------------------------
        location /player/ {
            proxy_pass http://ai_avatar_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/reports {
            proxy_pass http://ai_avatar_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # -------------------------------------------------------------
        # 2. AI Interpreter (VIA Rules, OpenAI Vision & Avatar Intake)
        # -------------------------------------------------------------
        location ~ ^/api/v1/(interpret|intake|places|partner-hospitals) {
            proxy_pass http://ai_interpreter_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 180s;
        }

        # -------------------------------------------------------------
        # 3. Core VISCAN Backend API (Screenings, Queues, Notifications)
        # -------------------------------------------------------------
        location /api/v1/ {
            proxy_pass http://backend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
        }

        # -------------------------------------------------------------
        # 4. Next.js Frontend (Clinician & Patient Workstation)
        # -------------------------------------------------------------
        location / {
            proxy_pass http://frontend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebRTC / WebSocket upgrades for interactive avatars
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
